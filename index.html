<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookArt</title>
  <style>
    /* ── 아이보리 컬러 변수 (레이아웃·구조는 원본 동일) ── */
    :root {
      --bg:      #F7F3EA;
      --surface: #EDE7D6;
      --gold:    #C9A84C;
      --border:  #D8CEBC;
      --text:    #1C1408;
      --sub:     #7A6A50;
      --red:     #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
      text-align: center;
    }
    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 3px;
    }

    /* ── Nav Tabs ── */
    .nav-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-tab {
      flex: 1;
      padding: 11px 0;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      color: var(--sub);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .nav-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
      font-weight: 600;
    }

    /* ── App ── */
    #app {
      padding: 20px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;
    }

    /* ── Search ── */
    .search-wrap { margin-top: 20px; }
    .search-box { display: flex; gap: 8px; }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--sub); }
    .search-box input:focus { outline: none; border-color: var(--gold); }
    .btn-search {
      padding: 10px 18px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-search:hover { background: #a88530; }
    #error-msg { color: var(--red); font-size: 11px; margin-top: 5px; text-align: center; }

    /* ── 메인 홈 링크 리스트 스타일 (추가됨) ── */
    .main-directory {
      margin-top: 30px;
      display: block;
    }
    .directory-section {
      margin-bottom: 25px;
    }
    .directory-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .directory-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }
    .directory-item {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .directory-item:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
    }

    /* ── Loading ── */
    #loading { display: none; text-align: center; padding: 48px 0; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--sub); }

    /* ── 리스트 화면 ── */
    #list-screen { display: none; margin-top: 20px; }
    .list-count {
      color: var(--gold);
      margin-bottom: 15px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .result-item {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .result-item:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
    }

    /* 목록용 섬네일 — 항상 표시, 실패 시 onerror로 숨김 */
    .list-thumb {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .item-info { flex: 1; min-width: 0; }
    .item-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .item-sub { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── 북마크 버튼 ── */
    .btn-bm {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      color: var(--border);
      flex-shrink: 0;
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .btn-bm:hover { transform: scale(1.15); color: var(--gold); }
    .btn-bm.saved { color: var(--gold); }

    /* ── 상세 화면 ── */
    #detail-screen { display: none; margin-top: 20px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-family: inherit;
      margin-bottom: 18px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--border); }

    /* 갤러리 — 항상 flex 표시, 개별 이미지 실패 시 onerror로 해당 아이템 숨김 */
    .gallery-container {
      width: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .gallery-container:empty { display: none; }
    .gallery-item {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: 100%;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }
    .gallery-item img { max-width: 100%; max-height: 420px; object-fit: contain; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── 상세 헤더 ── */
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .detail-title { font-size: 22px; font-weight: 700; line-height: 1.3; color: var(--text); }
    .detail-title-sub { font-size: 13px; color: var(--sub); margin-top: 4px; }

    /* ★ 초판연도 / 작가 생몰년 뱃지 */
    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 13px;
      font-size: 12px;
      color: var(--sub);
    }
    .meta-badge .badge-label { color: var(--gold); font-weight: 600; font-size: 11px; }

    /* ── 상세 그리드 ── */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    @media (max-width: 500px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-field {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .field-label { font-size: 10px; color: var(--sub); margin-bottom: 3px; }
    .field-value { font-size: 14px; color: var(--text); }

    .detail-desc {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── 북마크 탭 ── */
    #bookmark-screen { display: none; margin-top: 20px; }
    .bm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .bm-count { color: var(--gold); font-size: 14px; }
    .btn-clear {
      font-size: 12px;
      color: var(--sub);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    .empty-state { text-align: center; padding: 64px 20px; color: var(--sub); }
    .empty-state .e-icon { margin-bottom: 14px; opacity: 0.45; }
    .empty-state p { font-size: 14px; line-height: 1.7; }

    /* ── Footer ── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 16px 20px;
      font-size: 12px;
      color: var(--sub);
      letter-spacing: 2px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header onclick="goHome()" style="cursor: pointer;">
  <h1>BOOKART</h1>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" id="tab-search" onclick="switchTab('search')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    검색
  </div>
  <div class="nav-tab" id="tab-bm" onclick="switchTab('bookmarks')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
    </svg>
    북마크
  </div>
</div>

<div id="app">

  <div id="search-tab">
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="keyword" placeholder="작품명, 작가명, 코드 등으로 검색"
               onkeydown="if(event.key==='Enter') doSearch()">
        <button class="btn-search" onclick="doSearch()">검색</button>
      </div>
      <div id="error-msg"></div>
    </div>

    <div id="main-directory" class="main-directory">
      <div class="directory-section">
        <div class="directory-title">작가 리스트 (A-Z순)</div>
        <ul class="directory-list">
          <li class="directory-item" onclick="clickSearch('Andy Warhol')">Andy Warhol (앤디 워홀)</li>
          <li class="directory-item" onclick="clickSearch('Claude Monet')">Claude Monet (클로드 모네)</li>
          <li class="directory-item" onclick="clickSearch('Henri Matisse')">Henri Matisse (앙리 마티스)</li>
          <li class="directory-item" onclick="clickSearch('Pablo Picasso')">Pablo Picasso (파블로 피카소)</li>
          <li class="directory-item" onclick="clickSearch('Vincent van Gogh')">Vincent van Gogh (빈센트 반 고흐)</li>
        </ul>
      </div>
      
      <div class="directory-section">
        <div class="directory-title">작품명 리스트</div>
        <ul class="directory-list">
          <li class
