<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookArt</title>
  <style>
    :root {
      --bg:      #F8F4EC;
      --surface: #EDE7D9;
      --gold:    #C9A84C;
      --border:  #D8CEBC;
      --text:    #1C1408;
      --sub:     #7A6A50;
      --red:     #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
      text-align: center;
    }
    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 3px;
    }

    /* ── Nav Tabs ─────────────────────────────── */
    .nav-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-tab {
      flex: 1;
      padding: 11px 0;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      color: var(--sub);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .nav-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
      font-weight: 600;
    }

    /* ── App ──────────────────────────────────── */
    #app {
      padding: 20px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;
    }

    /* ── Search ───────────────────────────────── */
    .search-wrap { margin-top: 20px; }
    .search-box { display: flex; gap: 8px; }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .search-box input::placeholder { color: var(--sub); }
    .search-box input:focus { outline: none; border-color: var(--gold); }
    .btn-search {
      padding: 10px 18px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-search:hover { background: #a88530; }
    #error-msg { color: var(--red); font-size: 11px; margin-top: 5px; text-align: center; }

    /* ── Loading ──────────────────────────────── */
    #loading { display: none; text-align: center; padding: 48px 0; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--sub); }

    /* ── List Screen ──────────────────────────── */
    #list-screen { display: none; margin-top: 20px; }
    .list-count {
      color: var(--gold);
      margin-bottom: 15px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .result-item {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .result-item:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
    }

    /* 목록용 섬네일 (사진 없으면 자동 숨김) */
    .list-thumb {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .item-info { flex: 1; min-width: 0; }
    .item-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .item-sub { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── 북마크 버튼 ────────────────────────── */
    .btn-bm {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      color: var(--border);
      flex-shrink: 0;
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .btn-bm:hover { transform: scale(1.15); color: var(--gold); }
    .btn-bm.saved { color: var(--gold); }

    /* ── Detail Screen ────────────────────────── */
    #detail-screen { display: none; margin-top: 20px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-family: inherit;
      margin-bottom: 18px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--border); }

    /* ── 갤러리 ───────────────────────────────── */
    .gallery-container {
      width: 100%;
      display: none; /* 기본 숨김 — 이미지 로드 시 flex 전환 */
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .gallery-item {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: 100%;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }
    .gallery-item img { max-width: 100%; max-height: 420px; object-fit: contain; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── 상세 헤더 ──────────────────────────── */
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .detail-title { font-size: 22px; font-weight: 700; line-height: 1.3; color: var(--text); }
    .detail-title-sub { font-size: 13px; color: var(--sub); margin-top: 4px; }

    /* ★ 초판연도 / 작가 생몰년 뱃지 */
    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 13px;
      font-size: 12px;
      color: var(--sub);
    }
    .meta-badge .badge-label { color: var(--gold); font-weight: 600; font-size: 11px; }

    /* ── 상세 그리드 ──────────────────────────── */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    @media (max-width: 500px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-field {
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .field-label { font-size: 10px; color: var(--sub); margin-bottom: 3px; }
    .field-value { font-size: 14px; color: var(--text); }

    .detail-desc {
      margin-top: 14px;
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── 북마크 탭 ────────────────────────────── */
    #bookmark-screen { display: none; margin-top: 20px; }
    .bm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .btn-clear {
      font-size: 12px;
      color: var(--sub);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    .empty-state { text-align: center; padding: 64px 20px; color: var(--sub); }
    .empty-state .e-icon { font-size: 32px; margin-bottom: 14px; opacity: 0.5; }
    .empty-state p { font-size: 14px; line-height: 1.7; }

    /* ── Footer ───────────────────────────────── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 16px 20px;
      font-size: 12px;
      color: var(--sub);
      letter-spacing: 1px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>BOOKART</h1>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" id="tab-search" onclick="switchTab('search')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    검색
  </div>
  <div class="nav-tab" id="tab-bm" onclick="switchTab('bookmarks')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    북마크
  </div>
</div>

<div id="app">

  <!-- 검색 탭 -->
  <div id="search-tab">
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="keyword" placeholder="작품명, 작가명, 코드 등으로 검색"
               onkeydown="if(event.key==='Enter') doSearch()">
        <button class="btn-search" onclick="doSearch()">검색</button>
      </div>
      <div id="error-msg"></div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p>검색 중…</p>
    </div>

    <div id="list-screen">
      <div class="list-count" id="list-count"></div>
      <div id="list-container"></div>
    </div>

    <div id="detail-screen">
      <button class="back-btn" onclick="goBack()">← 목록으로</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- 북마크 탭 -->
  <div id="bookmark-screen">
    <div class="bm-header">
      <span class="list-count" id="bm-count" style="border:none;margin:0;padding:0;"></span>
      <button class="btn-clear" onclick="clearBookmarks()">전체 삭제</button>
    </div>
    <div id="bm-container"></div>
  </div>

</div>

<footer>소전문화재단</footer>

<script>
/* ════════════════════════════════════════════
   ★ Apps Script 배포 URL을 여기에 입력하세요
   ════════════════════════════════════════════ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxak15K6mN0VaNedvPzBHgTYCt4oXUPEwsvYHC_OyXRBs8NnNgQtUoOK1P5UJQ8vO2G/exec";

/* ── 상태 ─────────────────────────────────── */
let allData     = [];
let lastKeyword = "";

/* ── 북마크 아이콘 SVG ─────────────────────── */
const BM_EMPTY = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>`;
const BM_SAVED = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>`;

/* ════════════════════════════════════════════
   북마크 (localStorage — 기기 로컬 저장)
   ════════════════════════════════════════════ */
function getBMs()           { try { return JSON.parse(localStorage.getItem("bookart_bm") || "{}"); } catch { return {}; } }
function saveBMs(obj)       { localStorage.setItem("bookart_bm", JSON.stringify(obj)); }
function isBookmarked(code) { return String(code) in getBMs(); }

function toggleBM(code, e) {
  if (e) e.stopPropagation();
  const bms = getBMs();
  const key = String(code);
  if (bms[key]) {
    delete bms[key];
  } else {
    const item = allData.find(i => String(i["작품 코드"]) === key);
    if (item) bms[key] = item;
  }
  saveBMs(bms);
  document.querySelectorAll(`.btn-bm[data-code="${code}"]`).forEach(btn => {
    const saved = isBookmarked(code);
    btn.innerHTML = saved ? BM_SAVED : BM_EMPTY;
    btn.classList.toggle("saved", saved);
  });
  if (document.getElementById("bookmark-screen").style.display !== "none") renderBMScreen();
}

function clearBookmarks() {
  if (!confirm("북마크를 모두 삭제할까요?")) return;
  saveBMs({});
  renderBMScreen();
}

/* ════════════════════════════════════════════
   탭 전환
   ════════════════════════════════════════════ */
function switchTab(tab) {
  const isSearch = tab === "search";
  document.getElementById("tab-search").classList.toggle("active",  isSearch);
  document.getElementById("tab-bm").classList.toggle("active",      !isSearch);
  document.getElementById("search-tab").style.display      = isSearch ? "block" : "none";
  document.getElementById("bookmark-screen").style.display = isSearch ? "none"  : "block";
  if (!isSearch) renderBMScreen();
}

/* ════════════════════════════════════════════
   검색
   ════════════════════════════════════════════ */
async function doSearch() {
  const keyword = document.getElementById("keyword").value.trim();
  if (!keyword) { document.getElementById("error-msg").textContent = "검색어를 입력하세요."; return; }
  document.getElementById("error-msg").textContent = "";
  showLoading(true);
  try {
    const res  = await fetch(`${SCRIPT_URL}?code=${encodeURIComponent(keyword)}`);
    const json = await res.json();
    showLoading(false);
    if (!json.found || !json.data.length) {
      document.getElementById("error-msg").textContent = "검색 결과가 없습니다.";
      return;
    }
    allData     = json.data;
    lastKeyword = keyword;
    history.pushState({ view: "list", keyword }, "", `?q=${encodeURIComponent(keyword)}`);
    renderList();
  } catch {
    showLoading(false);
    document.getElementById("error-msg").textContent = "서버 오류가 발생했습니다.";
  }
}

function showLoading(on) {
  document.getElementById("loading").style.display       = on ? "block" : "none";
  document.getElementById("list-screen").style.display   = "none";
  document.getElementById("detail-screen").style.display = "none";
}

/* ════════════════════════════════════════════
   목록 렌더
   ════════════════════════════════════════════ */
function renderList() {
  document.getElementById("list-screen").style.display   = "block";
  document.getElementById("detail-screen").style.display = "none";
  document.getElementById("list-count").textContent = `총 ${allData.length}건이 발견되었습니다.`;
  document.getElementById("list-container").innerHTML = allData.map((item, idx) => listItemHTML(item, idx)).join("");
}

function listItemHTML(item, idx) {
  const photos     = item["사진"] ? item["사진"].toString().split(",") : [];
  const firstPhoto = photos.length > 0 ? photos[0].trim() : "";
  // 엑박 방지: onload 시에만 list-thumb 표시
  const thumbHTML = (firstPhoto && firstPhoto.startsWith("http"))
    ? `<div class="list-thumb" id="lth-${idx}">
         <img src="${firstPhoto}"
              onload="document.getElementById('lth-${idx}').style.display='flex'"
              loading="lazy">
       </div>`
    : "";
  const code    = String(item["작품 코드"] || "");
  const saved   = isBookmarked(code);
  const titleKo = item["표제(국문)"]  || "-";
  const titleOr = item["표제(원어)"]  || "";
  const author  = item["작가(국문)"]  || item["작가(원어)"] || item["작가 (원어)"] || "";
  const year    = item["발행연도"]    || "";
  const sub     = [titleOr, author, year].filter(Boolean).join(" · ");
  return `
    <div class="result-item" onclick="renderPanel(${idx})">
      ${thumbHTML}
      <div class="item-info">
        <div class="item-title">${titleKo}</div>
        <div class="item-sub">${sub}</div>
      </div>
      <button class="btn-bm ${saved ? "saved" : ""}" data-code="${code}"
              onclick="toggleBM('${code}', event)" title="${saved ? "북마크 해제" : "북마크"}">
        ${saved ? BM_SAVED : BM_EMPTY}
      </button>
    </div>`;
}

/* ════════════════════════════════════════════
   상세 렌더
   ════════════════════════════════════════════ */
function renderPanel(idx) {
  const d = allData[idx];
  if (!d) return;
  history.pushState(
    { view: "detail", idx, keyword: lastKeyword },
    "",
    `?q=${encodeURIComponent(lastKeyword)}&item=${idx}`
  );
  document.getElementById("list-screen").style.display   = "none";
  document.getElementById("detail-screen").style.display = "block";

  // 사진: http로 시작하는 URL만 — 엑박 방지
  const photos = d["사진"]
    ? d["사진"].toString().split(",").map(u => u.trim()).filter(u => u.startsWith("http"))
    : [];
  // 갤러리: 기본 숨김, 첫 이미지 로드 성공 시 flex 전환
  const galleryHTML = photos.length > 0 ? `
    <div class="gallery-container" id="main-gallery">
      ${photos.map(url => `
        <div class="gallery-item">
          <img src="${url}"
               onload="document.getElementById('main-gallery').style.display='flex'"
               loading="lazy">
        </div>`).join("")}
    </div>` : "";

  const code  = String(d["작품 코드"] || "");
  const saved = isBookmarked(code);

  // ★ 신규: 초판연도 / 작가 생몰년 뱃지
  const firstEd   = d["초판연도"]      ? String(d["초판연도"]).trim()      : "";
  const birthYear = d["작가 출생년도"] ? String(d["작가 출생년도"]).trim() : "";
  const deathYear = d["작가 사망년도"] ? String(d["작가 사망년도"]).trim() : "";
  let badges = "";
  if (firstEd)
    badges += `<span class="meta-badge"><span class="badge-label">작품 초판</span>${firstEd}</span>`;
  if (birthYear || deathYear) {
    const life = (birthYear && deathYear) ? `${birthYear} – ${deathYear}` : birthYear || deathYear;
    badges += `<span class="meta-badge"><span class="badge-label">작가 생몰년</span>${life}</span>`;
  }

  // 상세 그리드
  const fields = [
    ["작품 코드",  d["작품 코드"]],
    ["작가(국문)", d["작가(국문)"]],
    ["작가(원어)", d["작가(원어)"] || d["작가 (원어)"]],
    ["출판사",     d["출판사"]],
    ["발행연도",   d["발행연도"]],
    ["가로",       d["가로"]],
    ["세로",       d["세로"]],
    ["두께 D",     d["두께 D"]],
    ["소전권서",   d["소전권서"]],
    ["종",         d["종"]],
    ["권",         d["권"]],
    ["일러스트",   d["일러스트(국문)"]],
    ["현위치",     d["현위치"]],
    ["비고",       d["비고"]],
  ].filter(([, v]) => v !== undefined && v !== null && v !== "");

  const gridHTML = fields.map(([label, val]) => `
    <div class="detail-field">
      <div class="field-label">${label}</div>
      <div class="field-value">${val}</div>
    </div>`).join("");

  const descHTML = d["도서 설명"]
    ? `<div class="detail-desc">${d["도서 설명"]}</div>` : "";

  document.getElementById("detail-content").innerHTML = `
    ${galleryHTML}
    <div class="detail-header">
      <div>
        <div class="detail-title">${d["표제(국문)"] || ""}</div>
        <div class="detail-title-sub">${d["표제(원어)"] || ""}</div>
      </div>
      <button class="btn-bm ${saved ? "saved" : ""}" data-code="${code}"
              onclick="toggleBM('${code}', event)" title="${saved ? "북마크 해제" : "북마크"}"
              style="padding: 6px 8px; margin-top: 2px;">
        ${saved ? BM_SAVED : BM_EMPTY}
      </button>
    </div>
    ${badges ? `<div class="detail-meta-row">${badges}</div>` : ""}
    <div class="detail-grid">${gridHTML}</div>
    ${descHTML}
  `;
}

/* ════════════════════════════════════════════
   뒤로가기 (브라우저 history 연동)
   ════════════════════════════════════════════ */
function goBack() { history.back(); }

window.addEventListener("popstate", async (e) => {
  const st = e.state;
  if (!st) {
    document.getElementById("list-screen").style.display   = "none";
    document.getElementById("detail-screen").style.display = "none";
    return;
  }
  if (st.view === "list") {
    document.getElementById("detail-screen").style.display = "none";
    renderList();
  } else if (st.view === "detail") {
    if (!allData.length && st.keyword) {
      await fetchAndRender(st.keyword, st.idx);
    } else {
      renderPanel(st.idx);
    }
  }
});

/* ════════════════════════════════════════════
   북마크 탭 렌더
   ════════════════════════════════════════════ */
function renderBMScreen() {
  const bms  = getBMs();
  const keys = Object.keys(bms);
  document.getElementById("bm-count").textContent = `북마크 ${keys.length}건`;
  if (!keys.length) {
    document.getElementById("bm-container").innerHTML = `
      <div class="empty-state">
        <div class="e-icon">${BM_EMPTY}</div>
        <p>아직 북마크한 작품이 없어요.<br>검색 후 북마크 버튼을 눌러 저장하세요.</p>
      </div>`;
    return;
  }
  document.getElementById("bm-container").innerHTML = keys.map((key, i) => {
    const item       = bms[key];
    const photos     = item["사진"] ? item["사진"].toString().split(",") : [];
    const firstPhoto = photos.length > 0 ? photos[0].trim() : "";
    const thumbHTML  = (firstPhoto && firstPhoto.startsWith("http"))
      ? `<div class="list-thumb" id="bmth-${i}">
           <img src="${firstPhoto}"
                onload="document.getElementById('bmth-${i}').style.display='flex'"
                loading="lazy">
         </div>` : "";
    const code    = String(item["작품 코드"] || "");
    const titleKo = item["표제(국문)"]  || "-";
    const titleOr = item["표제(원어)"]  || "";
    const author  = item["작가(국문)"]  || item["작가(원어)"] || item["작가 (원어)"] || "";
    const year    = item["발행연도"]    || "";
    const sub     = [titleOr, author, year].filter(Boolean).join(" · ");
    return `
      <div class="result-item" onclick="openBMItem('${code}')">
        ${thumbHTML}
        <div class="item-info">
          <div class="item-title">${titleKo}</div>
          <div class="item-sub">${sub}</div>
        </div>
        <button class="btn-bm saved" data-code="${code}"
                onclick="toggleBM('${code}', event)" title="북마크 해제">
          ${BM_SAVED}
        </button>
      </div>`;
  }).join("");
}

function openBMItem(code) {
  const bms  = getBMs();
  const item = bms[String(code)];
  if (!item) return;
  const existIdx = allData.findIndex(i => String(i["작품 코드"]) === String(code));
  if (existIdx >= 0) {
    switchTab("search");
    renderPanel(existIdx);
  } else {
    allData     = [item];
    lastKeyword = String(item["표제(국문)"] || item["작품 코드"] || "");
    switchTab("search");
    renderPanel(0);
  }
}

/* ════════════════════════════════════════════
   URL 파라미터 복원 (새로고침 대응)
   ════════════════════════════════════════════ */
async function fetchAndRender(keyword, itemIdx) {
  showLoading(true);
  try {
    const res  = await fetch(`${SCRIPT_URL}?code=${encodeURIComponent(keyword)}`);
    const json = await res.json();
    showLoading(false);
    if (!json.found || !json.data.length) return;
    allData     = json.data;
    lastKeyword = keyword;
    if (itemIdx !== null && allData[itemIdx]) renderPanel(itemIdx);
    else renderList();
  } catch { showLoading(false); }
}

(function init() {
  const params = new URLSearchParams(window.location.search);
  const q      = params.get("q");
  const item   = params.get("item");
  if (q) {
    document.getElementById("keyword").value = q;
    fetchAndRender(q, item !== null ? parseInt(item) : null);
  }
})();
</script>
</body>
