<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookArt</title>
  <style>
    /* ── 아이보리 컬러 변수 (원본 레이아웃 유지) ── */
    :root {
      --bg:      #F7F3EA;
      --surface: #EDE7D6;
      --gold:    #C9A84C;
      --border:  #D8CEBC;
      --text:    #1C1408;
      --sub:     #7A6A50;
      --red:     #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
      text-align: center;
    }
    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 3px;
    }

    /* ── Nav Tabs ── */
    .nav-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-tab {
      flex: 1;
      padding: 11px 0;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      color: var(--sub);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .nav-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
      font-weight: 600;
    }

    /* ── App ── */
    #app {
      padding: 20px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;
    }

    /* ── Search ── */
    .search-wrap { margin-top: 20px; }
    .search-box { display: flex; gap: 8px; }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--sub); }
    .search-box input:focus { outline: none; border-color: var(--gold); }
    .btn-search {
      padding: 10px 18px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-search:hover { background: #a88530; }
    #error-msg { color: var(--red); font-size: 11px; margin-top: 5px; text-align: center; }

    /* ── 자동 실시간 연동 작가 명단 섹션 ── */
    .artist-directory {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .directory-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .directory-group {
      margin-bottom: 18px;
    }
    .directory-group:last-child { margin-bottom: 0; }
    .group-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .artist-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .artist-item {
      font-size: 14px;
      color: var(--sub);
      cursor: pointer;
      display: inline-block;
      align-self: flex-start;
      transition: color 0.15s;
    }
    .artist-item:hover {
      color: var(--gold);
      font-weight: 600;
      text-decoration: underline;
    }

    /* ── Loading ── */
    #loading { display: none; text-align: center; padding: 48px 0; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--sub); }

    /* ── 리스트 화면 ── */
    #list-screen { display: none; margin-top: 20px; }
    .list-count {
      color: var(--gold);
      margin-bottom: 15px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .result-item {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .result-item:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
    }

    .list-thumb {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .item-info { flex: 1; min-width: 0; }
    .item-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .item-sub { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── 북마크 버튼 ── */
    .btn-bm {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      color: var(--border);
      flex-shrink: 0;
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .btn-bm:hover { transform: scale(1.15); color: var(--gold); }
    .btn-bm.saved { color: var(--gold); }

    /* ── 상세 화면 ── */
    #detail-screen { display: none; margin-top: 20px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-family: inherit;
      margin-bottom: 18px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--border); }

    .gallery-container {
      width: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .gallery-container:empty { display: none; }
    .gallery-item {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: 100%;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }
    .gallery-item img { max-width: 100%; max-height: 420px; object-fit: contain; }
    .gallery-container::-webkit-scrollbar { height: 4px; }
    .gallery-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .detail-title { font-size: 22px; font-weight: 700; line-height: 1.3; color: var(--text); }
    .detail-title-sub { font-size: 13px; color: var(--sub); margin-top: 4px; }

    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 13px;
      font-size: 12px;
      color: var(--sub);
    }
    .meta-badge .badge-label { color: var(--gold); font-weight: 600; font-size: 11px; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    @media (max-width: 500px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-field {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .field-label { font-size: 10px; color: var(--sub); margin-bottom: 3px; }
    .field-value { font-size: 14px; color: var(--text); }

    .detail-desc {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── 북마크 탭 ── */
    #bookmark-screen { display: none; margin-top: 20px; }
    .bm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .bm-count { color: var(--gold); font-size: 14px; }
    .btn-clear {
      font-size: 12px;
      color: var(--sub);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    .empty-state { text-align: center; padding: 64px 20px; color: var(--sub); }
    .empty-state .e-icon { margin-bottom: 14px; opacity: 0.45; }
    .empty-state p { font-size: 14px; line-height: 1.7; }
  </style>
</head>
<body>

<header onclick="goHome()" style="cursor: pointer;">
  <h1>BOOKART</h1>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" id="tab-search" onclick="switchTab('search')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    검색
  </div>
  <div class="nav-tab" id="tab-bm" onclick="switchTab('bookmarks')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
    </svg>
    북마크
  </div>
</div>

<div id="app">

  <div id="search-tab">
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="keyword" placeholder="작품명, 작가명, 소전권서, 도서 설명 등으로 검색"
               onkeydown="if(event.key==='Enter') doSearch()">
        <button class="btn-search" onclick="doSearch()">검색</button>
      </div>
      <div id="error-msg"></div>
    </div>

    <div id="home-discovery-zone" style="display:none;">
      <div class="artist-directory">
        <h3 class="directory-title">작가 명단 (A-Z순 / 한글 병기)</h3>
        <div id="directory-content-box">
          </div>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p id="loading-text">데이터를 동기화하는 중입니다…</p>
    </div>

    <div id="list-screen">
      <div class="list-count" id="list-count"></div>
      <div id="list-container"></div>
    </div>

    <div id="detail-screen">
      <button class="back-btn" onclick="goBack()">← 목록으로</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="bookmark-screen">
    <div class="bm-header">
      <span class="bm-count" id="bm-count"></span>
      <button class="btn-clear" onclick="clearBookmarks()">전체 삭제</button>
    </div>
    <div id="bm-container"></div>
  </div>

</div>

<footer>소전문화재단</footer>

<script>
/* ════════════════════════════════════════════
   ★ Apps Script 배포 URL
   ════════════════════════════════════════════ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxak15K6mN0VaNedvPzBHgTYCt4oXUPEwsvYHC_OyXRBs8NnNgQtUoOK1P5UJQ8vO2G/exec";

/* ── 상태 마스터 관리 ── */
let masterDatabase = []; // 구글 시트에서 한 번에 긁어온 원본 전체 보관소
let allData        = []; // 현재 화면 목록에 바인딩된 결과 데이터
let lastKeyword    = "";

const BM_EMPTY = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>`;
const BM_SAVED = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>`;

/* ════════════════════════════════════════════
   [핵심 기능] 첫 글자 영문 이니셜 추출 (A-Z분류용)
   ════════════════════════════════════════════ */
function getFirstAlphabetLetter(item) {
  // 원어 이름 우선순위로 알파벳 이니셜 그룹화 시도, 없으면 국문 이름 기준
  let name = item["작가(원어)"] || item["작가 (원어)"] || item["작가(국문)"] || "";
  name = name.trim().replace(/['"\[\]]/g, ""); // 노이즈 제거
  if(!name) return "ETC";
  
  const first = name.charAt(0).toUpperCase();
  if(first >= "A" && first <= "Z") return first;
  
  // 만약 국문으로 시작한다면 한글 첫 자소로 임시 대응 (예외 방지)
  return "A-Z 리스트";
}

/* ════════════════════════════════════════════
   [핵심 복원] 무중단 전체 동기화 및 디렉토리 자동 생성
   ════════════════════════════════════════════ */
async function syncDatabaseAndBuildDirectory() {
  setView("loading");
  document.getElementById("loading-text").textContent = "데이터베이스를 불러오는 중입니다…";
  
  try {
    // 공백 하나(" ")를 전송하여 구글 시트에서 전체 데이터를 최초 1회 완전히 긁어옵니다.
    const res = await fetch(`${SCRIPT_URL}?code=${encodeURIComponent(" ")}`);
    const json = await res.json();
    
    if (json.found && json.data.length) {
      masterDatabase = json.data;
      
      // 작가 기준 중복 제거 및 포맷팅 (원어 이름 + 국문 한글 병기 처리)
      const artistMap = new Map();
      masterDatabase.forEach(item => {
        const koName = (item["작가(국문)"] || "").trim();
        const enName = (item["작가(원어)"] || item["작가 (원어)"] || "").trim();
        
        if (enName || koName) {
          // '영문이름 (국문이름)' 조합을 키값으로 설정해 고유 보관
          const displayFormat = enName && koName ? `${enName} (${koName})` : (enName || koName);
          // 검색용 키워드는 국문 이름 우선 매칭
          artistMap.set(displayFormat, koName || enName);
        }
      });

      // 영문 알파벳 이니셜 순 정렬 조립
      const groups = {};
      artistMap.forEach((searchVal, displayKey) => {
        const firstLetter = displayKey.charAt(0).toUpperCase();
        const letterGroup = (firstLetter >= "A" && firstLetter <= "Z") ? firstLetter : "기타 작가 명단";
        
        if (!groups[letterGroup]) groups[letterGroup] = [];
        groups[letterGroup].push({ key: displayKey, search: searchVal });
      });

      // 알파벳 딕셔너리 순 정렬
      const sortedLetters = Object.keys(groups).sort();
      
      const htmlContent = sortedLetters.map(letter => {
        // 그룹 내 개별 작가 정렬
        groups[letter].sort((a, b) => a.key.localeCompare(b.key));
        
        return `
          <div class="directory-group">
            <div class="group-label">${letter}</div>
            <div class="artist-list">
              ${groups[letter].map(art => `<span class="artist-item" onclick="clickArtist('${art.search}')">${art.key}</span>`).join("")}
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("directory-content-box").innerHTML = htmlContent;
      setView("none");
      document.getElementById("home-discovery-zone").style.display = "block";
    } else {
      throw new Error();
    }
  } catch(e) {
    setView("none");
    document.getElementById("directory-content-box").innerHTML = `<p style="text-align:center; font-size:13px; color:var(--red);">연동 실패. 페이지를 다시 열거나 새로고침 해주세요.</p>`;
    document.getElementById("home-discovery-zone").style.display = "block";
  }
}

/* ════════════════════════════════════════════
   작가 누르면 0초 만에 인메모리 정밀 필터링 작동
   ════════════════════════════════════════════ */
function clickArtist(artistName) {
  document.getElementById("keyword").value = artistName;
  document.getElementById("error-msg").textContent = "";
  
  const searchKey = artistName.toLowerCase().trim();
  
  // 마스터베이스에서 즉각 추출
  allData = masterDatabase.filter(item => {
    const targetKo = String(item["작가(국문)"] || "").toLowerCase();
    const targetEn = String(item["작가(원어)"] || item["작가 (원어)"] || "").toLowerCase();
    return targetKo.includes(searchKey) || targetEn.includes(searchKey);
  });

  document.getElementById("home-discovery-zone").style.display = "none";
  lastKeyword = artistName;
  history.pushState({ view: "list", keyword: artistName }, "", `?q=${encodeURIComponent(artistName)}`);
  renderList();
}

/* ════════════════════════════════════════════
   소전권서/도서 설명 100% 서치 통합 검색엔진 (doSearch)
   ════════════════════════════════════════════ */
function doSearch() {
  const keyword = document.getElementById("keyword").value.trim();
  if (!keyword) { document.getElementById("error-msg").textContent = "검색어를 입력하세요."; return; }
  document.getElementById("error-msg").textContent = "";
  
  const searchKey = keyword.toLowerCase();
  
  // 구글 시트 전체가 메모리에 확보되어 있으므로, 딜레이 없이 도서설명/소전권서까지 2차 전수 탐색을 수행합니다.
  allData = masterDatabase.filter(item => {
    const code  = String(item["작품 코드"] || "").toLowerCase();
    const titleKo = String(item["표제(국문)"] || "").toLowerCase();
    const titleEn = String(item["표제(원어)"] || "").toLowerCase();
    const artistKo = String(item["작가(국문)"] || "").toLowerCase();
    const artistEn = String(item["작가(원어)"] || item["작가 (원어)"] || "").toLowerCase();
    const desc  = String(item["도서 설명"] || "").toLowerCase();
    const classify = String(item["소전권서"] || "").toLowerCase();

    return code.includes(searchKey) || titleKo.includes(searchKey) || titleEn.includes(searchKey) || 
           artistKo.includes(searchKey) || artistEn.includes(searchKey) || desc.includes(searchKey) || classify.includes(searchKey);
  });

  if (allData.length === 0) {
    document.getElementById("error-msg").textContent = "검색 결과가 없습니다.";
    setView("none");
    document.getElementById("home-discovery-zone").style.display = "block";
    return;
  }

  document.getElementById("home-discovery-zone").style.display = "none";
  lastKeyword = keyword;
  history.pushState({ view: "list", keyword }, "", `?q=${encodeURIComponent(keyword)}`);
  renderList();
}

/* ════════════════════════════════════════════
   북마크 저장 및 화면 유기 연동 (완벽 작동 보장)
   ════════════════════════════════════════════ */
function getBMs()           { try { return JSON.parse(localStorage.getItem("bookart_bm") || "{}"); } catch { return {}; } }
function saveBMs(obj)       { localStorage.setItem("bookart_bm", JSON.stringify(obj)); }
function isBookmarked(code) { return String(code) in getBMs(); }

function toggleBM(code, e) {
  if (e) e.stopPropagation();
  const bms = getBMs(), key = String(code);
  if (bms[key]) {
    delete bms[key];
  } else {
    const item = masterDatabase.find(i => String(i["작품 코드"]) === key) || allData.find(i => String(i["작품 코드"]) === key);
    if (item) bms[key] = item;
  }
  saveBMs(bms);
  document.querySelectorAll(`.btn-bm[data-code="${code}"]`).forEach(btn => {
    const s = isBookmarked(code);
    btn.innerHTML = s ? BM_SAVED : BM_EMPTY;
    btn.classList.toggle("saved", s);
  });
  if (document.getElementById("bookmark-screen").style.display !== "none") renderBMScreen();
}

function clearBookmarks() {
  if (!confirm("북마크를 모두 삭제할까요?")) return;
  saveBMs({});
  renderBMScreen();
}

/* ── UI 화면 전환 제어 ── */
function switchTab(tab) {
  const s = tab === "search";
  document.getElementById("tab-search").classList.toggle("active", s);
  document.getElementById("tab-bm").classList.toggle("active", !s);
  document.getElementById("search-tab").style.display      = s ? "block" : "none";
  document.getElementById("bookmark-screen").style.display = s ? "none"  : "block";
  if (!s) renderBMScreen();
}

function goHome() {
  document.getElementById("keyword").value = "";
  document.getElementById("error-msg").textContent = "";
  allData = [];
  lastKeyword = "";
  history.pushState({}, "", window.location.pathname);
  switchTab('search');
  setView("none"); 
  document.getElementById("home-discovery-zone").style.display = "block";
}

function setView(v) {
  document.getElementById("loading").style.display       = v === "loading" ? "block" : "none";
  document.getElementById("list-screen").style.display   = v === "list"    ? "block" : "none";
  document.getElementById("detail-screen").style.display = v === "detail"  ? "block" : "none";
}

function renderList() {
  setView("list");
  document.getElementById("list-count").textContent = `총 ${allData.length}건이 발견되었습니다.`;
  document.getElementById("list-container").innerHTML = allData.map(listItemHTML).join("");
}

function listItemHTML(item, idx) {

  const firstPhoto = photos.map(p => p.trim()).find(p => p.startsWith("http")) || "";

  return `
    <div class="result-item" onclick="renderPanel(${idx})">
      ${thumbHTML}
      <div class="item-info">
        <div class="item-title">${item["표제(국문)"] || "-"}</div>
        <div class="item-sub">${sub}</div>
      </div>
      <button class="btn-bm ${s ? "saved" : ""}" data-code="${code}" onclick="toggleBM('${code}', event)" title="${s ? "북마크 해제" : "북마크"}">

      </button>
    </div>`;
}
